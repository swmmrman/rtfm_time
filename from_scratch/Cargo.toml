[package]
name = "from_scratch"
version = "0.1.0"
edition = "2024"

[dependencies]
cortex-m = { version = "0.7.7" }
cortex-m-rt = "0.7.5"

embassy-executor = { version = "0.9", features = [
    "arch-cortex-m",
    "executor-thread"
] }
embassy-rp = { version = "0.9.0", features = [
    "rp235xa",
    "time-driver",
    "critical-section-impl"
] }
embassy-time = "0.5.1"
